# ========================================================
# 基础运行模式设置
# ========================================================
mode: rule
log-level: info
allow-lan: true
mixed-port: 7890
ipv6: true

# ========================================================
# 流量嗅探 (Sniffer)
# ========================================================
sniffer:
  enable: true
  parse-pure-ip: true           # 纯 IP 请求反查域名
  force-dns-mapping: true       # 强制 Fake-IP 反查
  override-destination: true    # 替换目标为嗅探到的域名 (强烈建议为 true)
  sniff:
    http:
      ports: [80, 8080-8880]    # 扩宽 HTTP 端口范围
      override-destination: true
    tls:
      ports: [443, 8443]
    quic:                       # 保留对 HTTP/3 的嗅探
      ports: [443, 8443]

  # --- 免嗅探白名单 ---
  skip-domain:
    - '+.push.apple.com'        # 修复苹果 APNs 推送断连
    - dlg.io.mi.com
    - +.oray.com
    - +.sunlogin.net
  skip-dst-address:
    # Telegram 官方 ASN 网段 (防止 MTProto 被误判/阻断)
    - 91.105.192.0/23
    - 91.108.4.0/22
    - 91.108.8.0/21
    - 91.108.16.0/21
    - 91.108.56.0/22
    - 95.161.64.0/20
    - 149.154.160.0/20
    - 185.76.151.0/24
    - 2001:67c:4e8::/48
    - 2001:b28:f23c::/47
    - 2001:b28:f23f::/48
    - 2a0a:f280:203::/48

# ========================================================
# DNS 解析系统 (防泄漏与精准分流)
# ========================================================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  use-hosts: false
  use-system-hosts: false
  enhanced-mode: fake-ip
  respect-rules: false
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    # NTP 时间同步
    - '+.ntp.org.cn'
    - '+.pool.ntp.org'
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.*.edu.cn'
    - 'time.windows.com'
    # 局域网
    - '+.lan'
    - '+.local'
    - '+.localdomain'
    - '+.example'
    - '+.invalid'
    - '+.localhost'
    - '+.test'
    - '*.home.arpa'
    - '*.direct'
    - '+.arpa'
    - 'workgroup'
    # 网络探测与公共 Wi-Fi 认证门户
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'detectportal.firefox.com'
    - 'network-test.debian.org'
    - 'captive.apple.com'
    - 'connectivitycheck.gstatic.com'
    - 'clients3.google.com'
    - 'nmcheck.gnome.org'
    - 'httpbin.org'
    - 'auth.wiwide.com'
    # 国内运营商与网银“本机一键登录”
    - '*.cmpassport.com'       # 中国移动
    - 'open.e.189.cn'          # 中国电信
    - 'id.mail.wo.cn'          # 中国联通
    - '*.cmbchina.com'         # 招商银行
    # P2P 直连 / STUN 服务
    - 'stun.*.*'
    - 'stun.*.*.*'
    - '+.stun.*.*'
    - '+.stun.*'
    - '+.ts.net'               # Tailscale
    - "+.tailscale.com"
    - "+.tailscale.io"
    - '+.zerotier.com'         # Zerotier
    - 'global.turn.twilio.com' # Twilio
    - 'stun.l.google.com'      # Google STUN
    - '*.mcdn.bilivideo.cn'    # Bilibili 边缘 P2P 缓冲节点
    - 'relay.metered.ca'
    # 智能家居、投屏与局域网发现 (防内网设备失联)
    - '+.miwifi.com'           # 小米/红米路由器管理
    - 'router.asus.com'        # 华硕路由器管理
    - 'tplogin.cn'             # TP-Link 路由器管理
    - '+.plex.direct'          # Plex 流媒体内网穿透直连
    - '+.io.mi.com'            # 米家局域网云发现
    - '+.syncthing.net'        # Syncthing
    - 'instant.arubanetworks.com' #  Aruba 组网
    # Steam 下载与内容分发服务器
    - '+.cm.steampowered.com'
    - '+.steamcontent.com'
    - '+.steamserver.net'
    # 微软服务 (商店/OneDrive等)
    - '+.onedrive.live.com'
    - 'xbox.*.microsoft.com'
    - '+.xboxlive.com'         # Xbox 联机
    - 'storeedge.microsoft.com'
    # 苹果服务 (主要为 Apple Music 及部分内容分发)
    - '+.music.apple.com'
    - '+.itunes.apple.com'
    - 'mvod.itunes.apple.com'
    - '+.aaplimg.com'
    # 游戏联机
    - '+.srv.nintendo.net'     # 任天堂 NS 联机
    - '+.wargaming.net'        # Wargaming 游戏
    - 'stun.playstation.net'
    # 镜像站点
    - '+.mirror.tuna.tsinghua.edu.cn'
    - '+.mirrors.ustc.edu.cn'
    - '+.1ms.run'
    # PT / BT Trackers
    - "*.*.tracker.*"
    - "tracker.*"
    - "*.tracker.*"
    - "announce.*"
    - "torrent.*"
    - "+.lemonhd.net"
    - "+.btschool.club"
    - "+.ptcafe.club"
    # 自建站点
    - '+.elix1r.top'
    - '+.acc3l.top'
    # CF DNS
    - '+.ns.cloudflare.com'

  # 默认 DNS (用于解析下方的 DoH 域名)
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 兜底 DNS：国外域名走此解析 (使用纯 IP 格式防污染)
  nameserver:
    - https://8.8.8.8/dns-query               # Google DoH
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query               # Cloudflare DoH
    - https://dns.cloudflare.com/dns-query
    - https://dns.quad9.net/dns-query         # Quad9 DoH

  # 代理节点本身的 DNS 优先走国内直连解析
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query

  # 精准 DNS 分流策略 (国内域名及特定大厂走阿里 DoH)
  nameserver-policy:
    "+.ts.net": "100.100.100.100"              # 针对 Tailscale MagicDNS 功能的 DNS 预分流的核心配置
    "geosite:cn,apple,microsoft,steam@cn":
      - https://223.5.5.5/dns-query
      - https://223.6.6.6/dns-query
    +.elix1r.top,+.acc3l.top,+.tailscale.com,+.btschool.club,+.lemonhd.net,+.ptcafe.club:                  # 自建域名
      - https://223.5.5.5/dns-query
      - https://223.6.6.6/dns-query
    "geosite:geolocation-!cn":
      - https://8.8.8.8/dns-query
      - https://1.1.1.1/dns-query

# ========================================================
# 路由分流规则 (综合 geosite、geoip 与域名/IP)
# ========================================================
rules:
  # --------------------------------------------------------
  # 第一层级：P2P 与 内网直连防御 (最高优先级)
  # --------------------------------------------------------
  - PROCESS-NAME,tailscaled.exe,DIRECT
  - PROCESS-NAME,tailscale-ipn.exe,DIRECT
  - PROCESS-NAME,tailscaled,DIRECT
  - PROCESS-NAME,zerotier-one_x64,DIRECT
  - PROCESS-NAME,zerotier-one_x64.exe,DIRECT
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve      # Tailscale
  - AND,((NETWORK,UDP),(DST-PORT,41641)),DIRECT  # Tailscale 客户端常用端口
  - DOMAIN,pkgs.tailscale.com,🌈 节点选择
  - DOMAIN-SUFFIX,tailscale.com,DIRECT
  - DOMAIN-SUFFIX,ts.net,DIRECT

  - SRC-IP-CIDR,192.168.31.11/32,DIRECT          # NAS 服务器本地 IP 直连

  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - DST-PORT,6881-6889,DIRECT                    # BT 常用端口

  # --------------------------------------------------------
  # 第二层级：安全防御与屏蔽规则
  # --------------------------------------------------------
  # 拦截目标端口为 443 的 UDP 流量 (强制降级为 TCP，防止 QUIC 握手异常与干扰)
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  # 屏蔽广告与追踪
  - GEOSITE,category-ads-all,REJECT

  # --------------------------------------------------------
  # 第三层级：自建与私有流量直连
  # --------------------------------------------------------
  # PT 站点直连
  - DOMAIN-KEYWORD,btschool,DIRECT
  - DOMAIN-SUFFIX,lemonhd.net,DIRECT
  - DOMAIN-SUFFIX,ptcafe.club,DIRECT
  # 自建站点
  - DOMAIN-SUFFIX,elix1r.top,DIRECT
  - DOMAIN-SUFFIX,acc3l.top,DIRECT

  # --------------------------------------------------------
