# ========================================================
# 网络栈与连接调优
# ========================================================
unified-delay: true         # 显示真实端到端延迟
tcp-concurrent: true        # 开启 TCP 并发，提升网页加载速度
find-process-mode: always   # 强制获取进程名，确保 PROCESS-NAME 规则 100% 生效

# ========================================================
# TUN 模式设置
# ⚠️ Clash Party 客户端中开启 Tun 模式会覆盖此配置项
# ⚠️ 需要在客户端内 Tun 设置中对配置进行手动调整!!!
# ========================================================
tun:
  enable: true
  stack: system             # 推荐 system 栈，性能最好 (如遇兼容问题可改回 mixed)
  device: Mihomo
  auto-route: true          # 自动配置系统路由
  auto-detect-interface: true
  auto-redirect: false
  strict-route: true
  dns-hijack:
    - any:53                # 劫持所有局域网和本机的原生 53 端口 DNS 请求
  mtu: 1500
  route-exclude-address:
    - 100.64.0.0/10         # Tailscale 确保访问私有 IP 的数据包走 Tailscale 隧道
    - fd7a:115c:a1e0::/48

# ========================================================
# 局域网共享控制 (需配合顶层 allow-lan: true)
# ========================================================
lan-allowed-ips:
  - 0.0.0.0/0               # 允许所有局域网 IPv4 设备连接
  - ::/0                    # 允许所有局域网 IPv6 设备连接
lan-disallowed-ips: []

# ========================================================
# 状态持久化与数据库更新
# ========================================================
profile:
  store-selected: true      # 记忆节点选择状态
  store-fake-ip: true       # 记忆 Fake-IP 映射表，防重启断网

geo-auto-update: true       # 开启自动更新 (原为 false)
geo-update-interval: 24     # 每 24 小时更新一次
geodata-mode: true          # 启用高效的 dat 模式 (原为 false)
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
